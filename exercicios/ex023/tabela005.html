<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicios de Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
            margin: auto;
            width: 500px;
        }
        caption{
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }
        td, th{
            border: 1px solid black;
            padding: 8px;
        } 
        .csexo{
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Exercicios de Tabelas</h1>

    <table>
        <colgroup>
            <col class="cnome" >
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>

        <caption>Cadastro</caption>
        <tr>
            <th scope="col" >Nome</th>
            <th scope="col" >Sexo</th>
            <th scope="col" >Idade</th>
            <th scope="col" >Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>26</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Claudio</td>
            <td>M</td>
            <td>67</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td>James</td>
            <td>M</td>
            <td>63</td>
            <td>Musico</td>
        </tr>
        <tr>
            <td>Beatriz</td>
            <td>F</td>
            <td>19</td>
            <td>Secretaria</td>
        </tr>
        <tr>
            <td>João Pedro</td>
            <td>M</td>
            <td>22</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Elis</td>
            <td>F</td>
            <td>37</td>
            <td>Medica</td>
        </tr>
    </table>        
</body>
</html>
