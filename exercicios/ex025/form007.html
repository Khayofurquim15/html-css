<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulario</h1>

    <form action="cadastro.php" method="post" autocomplete="on" >

        <p>
            <label for="iest">Estado: </label>
            <select name="est" id="iest">

                <optgroup label="Região Sudeste" >
                    <option value="sp" selected >São Paulo</option>
                    <option value="mg">Mina Gerais</option>
                    <option value="rj">Rio de Janeiro</option>
                </optgroup>

                <optgroup label="Região Nordeste" >
                    <option value="mr">Marranão</option>
                    <option value="pn">Pernambuco</option>
                    <option value="rn">Rio Grande do Norte</option>
                </optgroup>

            </select>

        </p>

        <p>
            <label for="iprof">Profissão: </label>
            <input type="text" name="prof" id="iprof" list="listprof" required >
            <datalist id="listprof" >
                <option value="ADM">Adiministrador</option>
                <option value="DEV">Desenvolvedor</option>
                <option value="CONT">Contador</option>
            </datalist>
        </p>

        <p>
            <label for="imsg">Mensagem: </label> <br>
            <textarea name="msg" id="imsg" rows="10" cols="30"></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
