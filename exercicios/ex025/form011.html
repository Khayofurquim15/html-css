<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Teste de Formulario</h1>

    <form action="cadastro.php" method="post" autocomplete="on" >

        <fieldset>
            <legend>Complete o Cadastro</legend>

            <div>
                <label for="inome">Nome: </label>
                <input type="text" id="inome" name="nome" required minlength="8" maxlength="18" placeholder="Nome de Usuario..." autocomplete="username">
            </div>

            <div>
                <label for="isenha">Senha: </label>
                <input type="password" name="Senha" id="isenha" required min="10" max="20" placeholder="Coloque sua senha..." autocomplete="current-password" >
            </div>

            <div>
                <label for="imail">E-mail: </label>
                <input type="email" name="mail" id="imail" required placeholder="Coloque seu email" autocomplete="email">
            </div>

            <div>
                <label for="itel">Contato: </label>
                <input type="tel" name="tel" id="itel" required placeholder="(xx) xxxxx-xxxx" min="10" max="11" autocomplete="tel" >
            </div>

            <div>
                <label for="iidade">Idade: </label>
                <input type="range" name="Idade" id="iidade" min="0" max="60" value="18" oninput="ival.innerHTML = Number(iidade.value)">
                <output id="ival">18</output>
            </div>

            <div>
                <label for="iprof">Profissão: </label>
                <select name="prof" id="iprof">

                    <option value="PROFE">Professor</option>
                    <option value="ADM">Adiministrador</option>
                    <option value="COZ ">Cozinheiro</option>
                    <option value="HMF">HomeOficcer</option>
                    <option value="OTR" selected >Outro</option>

                </select>
            </div>

            <fieldset>
                <legend>Sexo</legend>
                <div>
                    <input type="radio" name="sexo" id="masc" value="M" checked >
                    <label for="masc">Masculino</label >

                    <input type="radio" name="sexo" id="femi" value="F" >
                    <label for="femi">Feminino</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Menssagem</legend>
                <textarea name="" id="" cols="40" rows="6"></textarea>
            </fieldset>

        </fieldset>

        <fieldset>
            <input type="submit" value="Cadastrar">
            <input type="reset" value="Limpar">
        </fieldset>
    </form>
</body>
</html>
