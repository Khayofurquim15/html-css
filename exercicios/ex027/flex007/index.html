<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        div.container{
            background-color: lightgray;
            display: flex;
            flex-flow: row wrap;
        }

        div.item{
            background-color: gray;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }

        div#i0{ order: 3; }
        div#i1{ order: 1; }
        div#i2{ order: -2; }
        div#i3{ order: 4; }
        div#i4{ order: -4; }
        div#i5{ order: 0; }
        div#i6{ order: 0; }

    </style>
</head>
<body>
    <div class="container" >
        <div class="item" id="i0" >A</div>
        <div class="item" id="i1" >B</div>
        <div class="item" id="i2" >C</div>
        <div class="item" id="i3" >D</div>
        <div class="item" id="i4" >E</div>
        <div class="item" id="i5" >F</div>
        <div class="item" id="i6" >G</div>
    </div>
</body>
</html>
